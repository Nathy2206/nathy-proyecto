name: tasks-app

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zigo2026}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-zigo}:${POSTGRES_PASSWORD:-zigo2026}@db:5432/${POSTGRES_DB:-tasks}
      DB_SYNCHRONIZE: "true"
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Server Components y Server Actions llaman a la API por la red interna
      API_URL: http://api:3001/api
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
